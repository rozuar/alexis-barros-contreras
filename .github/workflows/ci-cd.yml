name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.23'
  NODE_VERSION: '18'

jobs:
  # ============================================
  # Backend Tests
  # ============================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_USER: test
          POSTGRES_DB: test_alexis_art
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: source/backend/go.sum

      - name: Install dependencies
        working-directory: ./source/backend
        run: go mod download

      - name: Run tests with coverage
        working-directory: ./source/backend
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test_alexis_art?sslmode=disable

      - name: Check coverage threshold
        working-directory: ./source/backend
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Backend coverage: ${COVERAGE}%"
          # Uncomment to enforce minimum coverage
          # if (( $(echo "$COVERAGE < 50" | bc -l) )); then
          #   echo "Coverage is below 50%"
          #   exit 1
          # fi

      - name: Build backend
        working-directory: ./source/backend
        run: go build -o backend .

  # ============================================
  # Frontend Tests
  # ============================================
  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./source/frontend
        run: npm ci

      - name: Run linter
        working-directory: ./source/frontend
        run: npm run lint

      - name: Run tests with coverage
        working-directory: ./source/frontend
        run: npm run test:ci

      - name: Build
        working-directory: ./source/frontend
        run: npm run build

  # ============================================
  # Backoffice Tests
  # ============================================
  test-backoffice:
    name: Backoffice Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: source/backoffice/package-lock.json

      - name: Install dependencies
        working-directory: ./source/backoffice
        run: npm ci

      - name: Run linter
        working-directory: ./source/backoffice
        run: npm run lint

      - name: Run tests with coverage
        working-directory: ./source/backoffice
        run: npm run test:ci

      - name: Build
        working-directory: ./source/backoffice
        run: npm run build

